<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login — AI Healing Demo</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>AI Healing Demo</h1>
      <p class="subtitle">Sign in to continue</p>

      <form id="loginForm" data-test="login-form">
        <div class="field">
          <label>Username</label>
          <input type="text" id="username" data-test="username-input_renamed" autocomplete="username" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" data-test="password-input" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn" data-test="login-button" style="width:100%">Login</button>
        <p class="error-text" id="loginError" data-test="login-error"></p>
      </form>

      <div class="hint">
        Demo accounts: <code>admin / admin123</code> (Admin), <code>jane / jane123</code> (Manager)<br />
        <a href="#" id="chaosToggle" data-test="chaos-toggle-link">Toggle Chaos Mode</a>
        <span id="chaosState" data-test="chaos-state"></span>
      </div>
    </div>
  </div>

  <script src="js/locatorChaos.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('chaosToggle').addEventListener('click', (e) => {
      e.preventDefault();
      setChaosEnabled(!isChaosEnabled());
      window.location.reload();
    });
    document.getElementById('chaosState').textContent = isChaosEnabled() ? '(Chaos Mode: ON)' : '(Chaos Mode: OFF)';
  </script>
</body>
</html>
