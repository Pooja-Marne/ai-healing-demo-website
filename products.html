<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Products — AI Healing Demo</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="products">
  <div class="app-shell" id="app-shell">
    <aside class="sidebar">
      <div class="brand">AI Healing Demo</div>
      <ul class="nav-menu" data-test="nav-menu">
        <li>
          <a href="dashboard.html" data-test="nav-dashboard" class="">Dashboard</a>
        </li>
        <li>
          <a href="products.html" data-test="nav-products" class="active">Products</a>
        </li>
        <li>
          <a href="users.html" data-test="nav-users" class="">Users</a>
        </li>
        <li>
          <a href="orders.html" data-test="nav-orders" class="">Orders</a>
        </li>
      </ul>
    </aside>
    <main class="main">
      <div class="topbar">
        <h1 id="page-title">Products</h1>
        <div class="user-info">
          <span data-test="logged-in-user">admin (Admin)</span>
          <button class="btn btn-secondary btn-sm" data-test="logout-button" id="logoutBtn">Logout</button>
        </div>
      </div>
      <div id="page-content">
        <div class="panel">
          <div class="panel-header">
            <h2>Product Catalog</h2>
            <div class="search-bar">
              <input type="text" id="productSearch" data-test="product-search-input" placeholder="Search products..." value="" />
              <button class="btn" id="addProductBtn" data-test="add-product-button">+ Add Product</button>
            </div>
          </div>
          <table>
            <thead><tr><th>Name</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead>
            <tbody data-test="products-table-body">
              <tr data-test="product-row-1">
                <td>Wireless Mouse</td>
                <td>$19.99</td>
                <td>42</td>
                <td><button class="btn btn-danger btn-sm" data-test="delete-product-1" data-action="delete-product" data-id="1">Delete</button></td>
              </tr>
              <tr data-test="product-row-2">
                <td>Mechanical Keyboard</td>
                <td>$59.99</td>
                <td>15</td>
                <td><button class="btn btn-danger btn-sm" data-test="delete-product-2" data-action="delete-product" data-id="2">Delete</button></td>
              </tr>
              <tr data-test="product-row-3">
                <td>27" Monitor</td>
                <td>$249.00</td>
                <td>8</td>
                <td><button class="btn btn-danger btn-sm" data-test="delete-product-3" data-action="delete-product" data-id="3">Delete</button></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="modal-overlay" id="productModal" data-test="product-modal">
          <div class="modal">
            <h3>Add Product</h3>
            <div class="field">
              <label>Name</label>
              <input type="text" id="newProductName" data-test="new-product-name" />
            </div>
            <div class="field">
              <label>Price</label>
              <input type="number" id="newProductPrice" data-test="new-product-price" step="0.01" />
            </div>
            <div class="field">
              <label>Stock</label>
              <input type="number" id="newProductStock" data-test="new-product-stock" />
            </div>
            <div class="modal-actions">
              <button class="btn btn-secondary" id="cancelProductBtn" data-test="cancel-product-button">Cancel</button>
              <button class="btn" id="saveProductBtn" data-test="save-product-button">Save</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
